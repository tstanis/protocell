<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #080b11;
    color: #d6dae2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 28px; }
  .stage {
    position: relative;
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 50% 40%, #0d1420 0%, #080b11 70%);
    border: 1px solid rgba(255,255,255,0.06);
  }
  canvas { display: block; width: 100%; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-top: 14px;
  }
  button {
    font: inherit; font-size: 13px;
    color: #d6dae2; background: #161d29;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 8px 13px; cursor: pointer;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover { background: #1e2836; border-color: rgba(255,255,255,0.22); }
  button:disabled { opacity: .4; cursor: default; }
  button.danger { border-color: rgba(226,75,74,0.4); }
  button.danger:hover { background: #2a1618; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px 20px;
    margin-top: 16px; font-size: 12.5px; color: #9aa2b0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .status { margin-top: 12px; font-size: 12.5px; color: #7f8796; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>
  <div class="controls">
    <button id="btnAmino">Build amino-acid channel</button>
    <button id="btnDie" class="danger">Cut ATP (die)</button>
    <button id="btnRevive" disabled>Restart</button>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#ffb03a"></i>Glucose — slow tumble</span>
    <span><i class="dot" style="background:#3bd6b4"></i>Amino acid — fast jitter</span>
    <span><i class="dot" style="background:#fff0a8"></i>ATP — spark</span>
    <span><i class="dot" style="background:#57e6c8"></i>Open channel</span>
    <span><i class="dot" style="background:#b6a8ff"></i>Nucleus</span>
  </div>
  <div class="status" id="status">Density = concentration · motion type = species · the ooze = alive.</div>
</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 720, H = 520;
const cx = 356, cy = 258, R = 150, MT = 15; // center, base radius, membrane thickness

let dpr = 1, scale = 1;
function resize() {
  const cssW = Math.min(cvs.parentElement.clientWidth, 760);
  const cssH = cssW * H / W;
  dpr = window.devicePixelRatio || 1;
  scale = cssW / W;
  cvs.width = Math.round(cssW * dpr);
  cvs.height = Math.round(cssH * dpr);
  cvs.style.height = cssH + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---- state ----
let alive = 1;          // 1 = fully alive, decays toward ~0.08 on death
let aminoOpen = false;
let t = 0;

const LEFT = Math.PI;   // glucose faces left
const RIGHT = 0;        // amino faces right
const CH_HALF = 0.30;   // channel angular half-width

// membrane radius: zero-mean shape ooze, so enclosed area stays ~constant
function memR(theta) {
  const o = 0.06 + 0.94 * alive; // slack when dead
  return R * (1 + o * (
    0.045 * Math.sin(3 * theta + 0.7 * t) +
    0.030 * Math.sin(5 * theta - 0.5 * t) +
    0.020 * Math.sin(2 * theta + 1.1 * t)
  ));
}
function angDiff(a, b) { let d = Math.abs(a - b) % (2 * Math.PI); return d > Math.PI ? 2 * Math.PI - d : d; }

// ---- particles ----
// type: 'glu' | 'amino'  |  state: 'out' | 'in'
let glu = [], amino = [], atp = [];
const OUT_GLU = 74, OUT_AMINO = 74, IN_CAP = 42;

function spawnOutside(type) {
  // place in the patch on the correct side, just beyond the membrane
  const base = type === 'glu' ? LEFT : RIGHT;
  const a = base + (Math.random() - 0.5) * 1.5;
  const d = R + 20 + Math.random() * 120;
  return {
    x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d,
    vx: 0, vy: 0, type, state: 'out',
    head: Math.random() * 6.28, r: type === 'glu' ? 3.1 : 2.2
  };
}
function spawnInside(type) {
  const a = Math.random() * 6.28, d = Math.random() * (R - MT - 30);
  return {
    x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d,
    vx: 0, vy: 0, type, state: 'in',
    head: Math.random() * 6.28, r: type === 'glu' ? 3.1 : 2.2
  };
}
for (let i = 0; i < OUT_GLU; i++) glu.push(spawnOutside('glu'));
for (let i = 0; i < OUT_AMINO; i++) amino.push(spawnOutside('amino'));
for (let i = 0; i < 8; i++) glu.push(spawnInside('glu'));
for (let i = 0; i < 6; i++) amino.push(spawnInside('amino'));

// nanobot: moves mechanically (straight lines, pauses)
const bot = { x: cx + 40, y: cy - 20, tx: cx + 40, ty: cy - 20, wait: 0, rot: 0 };

function crossable(type, ang) {
  if (type === 'glu') return angDiff(ang, LEFT) < CH_HALF;
  return aminoOpen && angDiff(ang, RIGHT) < CH_HALF;
}

function step(dt) {
  t += dt;
  if (alive < 1 && alive > 0.081) alive = Math.max(0.08, alive - dt * 0.55);
  const mo = alive; // motion multiplier

  // nanobot
  if (alive > 0.5) {
    const dx = bot.tx - bot.x, dy = bot.ty - bot.y, dd = Math.hypot(dx, dy);
    if (dd < 4) {
      bot.wait -= dt;
      if (bot.wait <= 0) {
        const a = Math.random() * 6.28, d = Math.random() * (R - MT - 45);
        bot.tx = cx + Math.cos(a) * d; bot.ty = cy + Math.sin(a) * d; bot.wait = 0.5;
      }
    } else {
      const sp = 46 * dt; bot.x += dx / dd * sp; bot.y += dy / dd * sp;
      bot.rot += dt * 1.4;
    }
  }

  const lists = [glu, amino];
  for (const list of lists) {
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      const ang = Math.atan2(p.y - cy, p.x - cx);
      const dist = Math.hypot(p.x - cx, p.y - cy);
      const outerR = memR(ang), innerR = outerR - MT;

      // --- motion character by species ---
      if (p.type === 'glu') {
        p.head += (Math.random() - 0.5) * 1.4 * dt * 20 * mo; // lazy tumble
        const sp = 17 * mo;
        p.vx += (Math.cos(p.head) * sp - p.vx) * 0.06;
        p.vy += (Math.sin(p.head) * sp - p.vy) * 0.06;
      } else {
        p.vx += (Math.random() - 0.5) * 90 * dt * mo; // staccato jitter
        p.vy += (Math.random() - 0.5) * 90 * dt * mo;
        p.vx *= 0.86; p.vy *= 0.86;
      }

      // --- import steering at channel ---
      if (p.state === 'out' && crossable(p.type, ang) && dist < outerR + 46) {
        const pull = 60 * mo;
        p.vx += (cx - p.x) / dist * pull * dt * 4;
        p.vy += (cy - p.y) / dist * pull * dt * 4;
      }

      p.x += p.vx * dt; p.y += p.vy * dt;

      const nang = Math.atan2(p.y - cy, p.x - cx);
      const ndist = Math.hypot(p.x - cx, p.y - cy);
      const no = memR(nang), ni = no - MT;

      if (p.state === 'out') {
        if (ndist < ni) { p.state = 'in'; }                 // crossed inward
        else if (ndist < no && !crossable(p.type, nang)) {  // bounce off wall
          const push = (no - ndist) + 1;
          p.x += Math.cos(nang) * push; p.y += Math.sin(nang) * push;
          p.vx *= -0.3; p.vy *= -0.3;
        }
        // drifted too far away → recycle to keep patch dense
        if (ndist > R + 150) { list[i] = spawnOutside(p.type); }
      } else { // inside
        if (ndist > ni) { // keep in cytoplasm
          const push = (ndist - ni) + 1;
          p.x -= Math.cos(nang) * push; p.y -= Math.sin(nang) * push;
          p.vx *= -0.3; p.vy *= -0.3;
        }
      }
    }
  }

  // metabolism: consume imported glucose over cap → emit ATP sparks, respawn outside
  if (alive > 0.5) {
    const inGlu = glu.filter(p => p.state === 'in');
    if (inGlu.length > IN_CAP) {
      const victim = inGlu[0];
      const idx = glu.indexOf(victim);
      atp.push({ x: victim.x, y: victim.y, life: 1, r: 1.7 });
      atp.push({ x: victim.x + 4, y: victim.y - 3, life: 1, r: 1.4 });
      glu.splice(idx, 1);
      glu.push(spawnOutside('glu'));
    }
    // trickle background ATP so a living cell always sparkles a little
    if (Math.random() < 0.5) {
      const a = Math.random() * 6.28, d = Math.random() * (R - MT - 40);
      atp.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d, life: 1, r: 1.5 });
    }
  }
  for (let i = atp.length - 1; i >= 0; i--) {
    const s = atp[i];
    s.life -= dt * 1.6;
    s.x += (Math.random() - 0.5) * 18 * dt * mo;
    s.y += (Math.random() - 0.5) * 18 * dt * mo;
    if (s.life <= 0) atp.splice(i, 1);
  }
}

// ---- draw ----
function drawZones() {
  const g1 = ctx.createRadialGradient(112, cy, 15, 112, cy, 178);
  g1.addColorStop(0, 'rgba(255,176,58,0.13)');
  g1.addColorStop(1, 'rgba(255,176,58,0)');
  ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);
  const g2 = ctx.createRadialGradient(W - 112, cy, 15, W - 112, cy, 178);
  g2.addColorStop(0, 'rgba(59,214,180,0.13)');
  g2.addColorStop(1, 'rgba(59,214,180,0)');
  ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.035)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

function membranePath(rf) {
  ctx.beginPath();
  for (let i = 0; i <= 140; i++) {
    const th = i / 140 * Math.PI * 2;
    const r = rf(th);
    const x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawCell() {
  // cytoplasm fill
  membranePath(th => memR(th) - MT);
  ctx.fillStyle = alive > 0.5 ? 'rgba(38,60,82,0.74)' : 'rgba(46,50,58,0.62)';
  ctx.fill();

  // membrane band (lipid)
  membranePath(th => memR(th) - MT / 2);
  ctx.lineWidth = MT;
  ctx.strokeStyle = alive > 0.5 ? 'rgba(226,196,138,0.85)' : 'rgba(150,150,150,0.6)';
  ctx.stroke();

  // tile ticks across the band
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(20,20,25,0.5)';
  for (let i = 0; i < 64; i++) {
    const th = i / 64 * Math.PI * 2, r = memR(th);
    const c = Math.cos(th), s = Math.sin(th);
    ctx.beginPath();
    ctx.moveTo(cx + c * r, cy + s * r);
    ctx.lineTo(cx + c * (r - MT), cy + s * (r - MT));
    ctx.stroke();
  }

  // channels (glow segments)
  function drawChannel(base, color) {
    ctx.save();
    ctx.lineWidth = MT + 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.beginPath();
    const steps = 14;
    for (let i = 0; i <= steps; i++) {
      const th = base - CH_HALF + (i / steps) * CH_HALF * 2;
      const r = memR(th) - MT / 2;
      const x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }
  drawChannel(LEFT, alive > 0.5 ? 'rgba(87,230,200,0.95)' : 'rgba(120,150,140,0.5)');
  if (aminoOpen) drawChannel(RIGHT, alive > 0.5 ? 'rgba(87,230,200,0.95)' : 'rgba(120,150,140,0.5)');
}

function drawNucleus() {
  const nx = cx - 26, ny = cy + 32, nr = 54;
  ctx.beginPath();
  for (let i = 0; i <= 80; i++) {
    const th = i / 80 * Math.PI * 2;
    const r = nr * (1 + (0.05 + 0.9 * alive) * 0.04 * Math.sin(4 * th + t * 0.8));
    const x = nx + Math.cos(th) * r, y = ny + Math.sin(th) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,104,220,0.30)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(182,168,255,0.7)';
  ctx.stroke();
  // faint "blueprints"
  ctx.fillStyle = 'rgba(210,200,255,0.5)';
  for (let i = 0; i < 5; i++) {
    const a = i * 1.3 + t * 0.2, d = 10 + (i % 3) * 12;
    ctx.beginPath();
    ctx.arc(nx + Math.cos(a) * d, ny + Math.sin(a) * d, 1.6, 0, 6.28);
    ctx.fill();
  }
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  const a = 0.4 + 0.6 * alive;
  for (const p of glu) {
    ctx.fillStyle = `rgba(255,176,58,${0.5 * a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 1.3, 0, 6.28); ctx.fill();
    ctx.fillStyle = `rgba(255,214,150,${0.85 * a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, 6.28); ctx.fill();
  }
  for (const p of amino) {
    ctx.fillStyle = `rgba(59,214,180,${0.5 * a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 1.0, 0, 6.28); ctx.fill();
    ctx.fillStyle = `rgba(170,246,224,${0.85 * a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, 6.28); ctx.fill();
  }
  for (const s of atp) {
    ctx.fillStyle = `rgba(255,240,168,${0.9 * s.life * a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 1.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = `rgba(255,255,235,${s.life * a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.5, 0, 6.28); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawBot() {
  const on = alive > 0.5;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = on ? 'rgba(90,170,240,0.22)' : 'rgba(120,130,145,0.10)';
  ctx.beginPath(); ctx.arc(bot.x, bot.y, 15, 0, 6.28); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(bot.x, bot.y);
  ctx.rotate(bot.rot);
  ctx.fillStyle = on ? 'rgba(206,230,255,0.96)' : 'rgba(150,160,175,0.6)';
  ctx.strokeStyle = on ? 'rgba(120,185,235,0.95)' : 'rgba(120,130,145,0.6)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2, x = Math.cos(a) * 8, y = Math.sin(a) * 8;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = on ? 'rgba(58,108,168,0.9)' : 'rgba(90,100,115,0.7)';
  ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, 6.28); ctx.fill();
  ctx.restore();
  ctx.fillStyle = on ? 'rgba(180,215,255,0.9)' : 'rgba(150,160,175,0.55)';
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('nanobot (you)', bot.x + 14, bot.y + 4);
}

function label(text, x, y, align = 'left', c = 'rgba(214,218,226,0.72)') {
  ctx.fillStyle = c;
  ctx.font = '13px -apple-system, sans-serif';
  ctx.textAlign = align;
  ctx.fillText(text, x, y);
}

function drawLabels() {
  ctx.textBaseline = 'alphabetic';
  label('Extracellular space', cx, 22, 'center', 'rgba(222,226,234,0.82)');
  label('glucose-rich', 30, 44, 'left', 'rgba(255,196,120,0.9)');
  label('amino-rich' + (aminoOpen ? ' · importing' : ' · no channel yet'), W - 30, 44, 'right', 'rgba(150,236,212,0.9)');
  label('Cytoplasm', cx, H - 32, 'center', 'rgba(200,222,238,0.78)');
  ctx.strokeStyle = 'rgba(182,168,255,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(384, 300); ctx.lineTo(438, 322); ctx.stroke();
  label('Nucleus', 444, 326, 'left', 'rgba(200,188,255,0.9)');
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  step(dt);

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  drawZones();
  drawCell();
  drawNucleus();
  drawParticles();
  drawBot();
  drawLabels();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- controls ----
const status = document.getElementById('status');
document.getElementById('btnAmino').addEventListener('click', function () {
  aminoOpen = true;
  this.disabled = true;
  status.textContent = 'Amino-acid channel built — teal now crosses the right membrane and feeds the interior.';
});
document.getElementById('btnDie').addEventListener('click', function () {
  if (alive === 1) alive = 0.999;
  this.disabled = true;
  document.getElementById('btnRevive').disabled = false;
  status.textContent = 'ATP gone. Pumps stop, the ooze stills, gradients slump toward uniform — this stillness is death.';
});
document.getElementById('btnRevive').addEventListener('click', function () {
  alive = 1;
  this.disabled = true;
  document.getElementById('btnDie').disabled = false;
  status.textContent = 'Powered back up — motion returns.';
});
</script>
</body>
</html>
